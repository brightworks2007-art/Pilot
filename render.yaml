# NOTE: With the combined-service approach (see root README), you likely
# won't use this file at all -- creating the service manually via
# "New -> Web Service" (Docker runtime) avoids Render's Blueprint payment-
# method requirement. This file is kept for reference / in case you switch
# to Blueprint deployment later, and describes that same single service.

services:
  - type: web
    name: pilot
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: documents
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FRONTEND_ORIGINS
        value: "*" # same-origin now, so CORS barely matters -- this just avoids blocking anything
